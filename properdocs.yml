site_name: MP CLI
site_url: https://LegitCirtuitz.github.io/multipcli/
site_author: LegitCirtuitz
site_description: Multi Purpose Command Line Interface

repo_name: LegitCirtuitz/multipcli
repo_url: https://github.com/LegitCirtuitz/multipcli

copyright: Copyright &copy; 2026 LegitCirtuitz
theme:
  name: materialx
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono

extra_css:
  - stylesheets/custom_footer.css

plugins:
  - blog:
      post_readtime: true
      post_excerpt: optional
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - redirects
  - mkdocs_quiz:
      enabled_by_default: true        # Enable quizzes by default on all pages
      auto_number: false              # Auto-number questions (Question 1:, Question 2:, etc.)
      show_correct: false              # Show correct answers when user gets it wrong
      auto_submit: false              # Auto-submit single-choice quizzes on selection
      disable_after_submit: true      # Disable question after first submission
      shuffle_answers: false          # Randomize the order of answers
      show_progress: true             # Show progress tracker sidebar and mobile bar
      progress_sidebar_position: top  # Position of progress tracker: "top" or "bottom"
      confetti: true                  # Show confetti animation when all quizzes completed
      embed_source: true              # Embed quiz source in HTML for CLI URL fetching
      language: en                    # Default language for quiz UI
      language_patterns: []           # Auto-detect language based on file paths
      custom_translations: {}         # Custom translation files
      cli_run: {}                     # CLI runner menu configuration

extra:
  status:
    new: Recently added
    deprecated: Deprecated
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LegitCirtuitz
    - icon: fontawesome/brands/discord
      link: https://discord.gg/EMM2v5BW4v
    - icon: fontawesome/brands/youtube
      link: https://youtube.com/@ItsCirtwitz

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  # Added Grid support
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: LegitCirtuitz
      repo: oscli
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Getting Started:
    - Introduction: index.md
  - Learn:
    - Menu: learn/index.md
